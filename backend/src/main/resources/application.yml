# 研时后端服务配置
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: yanshi-backend

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yanshi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yanshi.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI配置
ai:
  qwen:
    # 通义千问API密钥
    api-key: xx
    model: qwen-turbo
    max-tokens: 1000
    temperature: 0.7
  python:
    # Python解释器路径（支持conda虚拟环境）
    path: conda run -n qw python
    # AI脚本路径
    script-path: crawler/ai_extract.py

# 日志配置
logging:
  level:
    com.yanshi: info
    com.baomidou.mybatisplus: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/yanshi-backend.log
    max-size: 10MB
    max-history: 30
